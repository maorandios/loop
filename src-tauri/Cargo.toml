[package]
name = "filerelay"
version = "0.1.0"
description = "FileRelay — send a file to a teammate and get the edited copy back"
authors = ["FileRelay"]
edition = "2021"

[lib]
name = "filerelay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.4.4"
tauri-plugin-autostart = "2"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
blake3 = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "time"] }
notify = "6.1"
